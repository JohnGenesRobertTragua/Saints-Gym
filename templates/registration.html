<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saints Gym - Registration</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='phone.css') }}">

    <style>
        /* =========================================================
           SAINTS GYM - MEMBER REGISTRATION
           Scoped layout polish. Keeps the working phone component.
           ========================================================= */

        :root {
            --saints-black: #0b0b0b;
            --saints-panel: #151515;
            --saints-panel-2: #202020;
            --saints-gold: #d6a52b;
            --saints-gold-light: #f1c75b;
            --saints-text: #ffffff;
            --saints-muted: #a7a7a7;
        }

        html {
            min-height: 100%;
            background: var(--saints-black) !important;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 18%, rgba(214,165,43,.11), transparent 34%),
                linear-gradient(145deg, #080808 0%, #121212 52%, #080808 100%) !important;
            color: var(--saints-text) !important;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .registration-container {
            width: min(100%, 370px) !important;
            max-width: 370px !important;
            margin: 0 auto;
            padding: 24px 24px 22px !important;
            background: rgba(18, 18, 18, .98) !important;
            border: 1px solid rgba(214, 165, 43, .40) !important;
            border-radius: 14px !important;
            box-shadow:
                0 20px 48px rgba(0,0,0,.50),
                0 0 0 1px rgba(255,255,255,.025) inset,
                0 0 28px rgba(214,165,43,.055) !important;
        }

        .gym-header {
            margin: 0 0 20px !important;
            text-align: center !important;
        }

        .gym-header h1 {
            margin: 0 !important;
            color: #ffffff !important;
            font-size: 23px !important;
            line-height: 1.15 !important;
            font-weight: 800 !important;
            letter-spacing: .4px !important;
            text-shadow: 0 1px 0 #000, 0 0 14px rgba(214,165,43,.10);
        }

        .gym-header p {
            margin: 5px 0 0 !important;
            color: var(--saints-gold-light) !important;
            font-size: 11px !important;
            line-height: 1.2 !important;
            font-weight: 600 !important;
        }

        .registration-form {
            width: 100%;
        }

        .registration-form .form-group {
            margin: 0 0 13px !important;
        }

        .registration-form .form-group label {
            display: block;
            margin: 0 0 6px !important;
            color: #f0f0f0 !important;
            font-size: 11px !important;
            line-height: 1.15 !important;
            font-weight: 700 !important;
        }

        .registration-form .form-group > input:not([data-phone-input]) {
            width: 100% !important;
            height: 43px !important;
            min-height: 43px !important;
            padding: 0 11px !important;
            box-sizing: border-box !important;
            background: #202020 !important;
            color: #ffffff !important;
            border: 1px solid #4a4a4a !important;
            border-radius: 8px !important;
            font-size: 12px !important;
            outline: none !important;
        }

        .registration-form .form-group > input:not([data-phone-input]):focus {
            border-color: var(--saints-gold) !important;
            box-shadow: 0 0 0 2px rgba(214,165,43,.14) !important;
        }

        .registration-form .form-group > input::placeholder {
            color: #929292 !important;
        }

        .registration-form .form-group > input[readonly] {
            background: #242424 !important;
            color: #eeeeee !important;
        }

        /* Keep the working international phone component full width. */
        .registration-form .phone-input-wrap {
            width: 100% !important;
            margin: 0 !important;
        }

        .registration-form .phone-control-row {
            width: 100% !important;
        }

        .registration-form .phone-country-button,
        .registration-form .phone-local-input {
            height: 43px !important;
            min-height: 43px !important;
        }

        .registration-form .phone-help-text,
        .registration-form .phone-validation-message {
            font-size: 10.5px !important;
            line-height: 1.35 !important;
        }

        .registration-form .phone-help-text {
            margin-top: 5px !important;
        }

        .registration-form .phone-validation-message {
            margin-top: 3px !important;
        }

        .registration-actions {
            display: flex;
            flex-direction: column;
            gap: 9px;
            width: 100%;
            margin-top: 3px;
        }

        .registration-actions button,
        .registration-actions .cancel-button {
            width: 100% !important;
            height: 43px !important;
            min-height: 43px !important;
            margin: 0 !important;
            padding: 0 12px !important;
            box-sizing: border-box !important;
            border-radius: 8px !important;
            font-size: 11px !important;
            font-weight: 800 !important;
            line-height: 1 !important;
            text-decoration: none !important;
        }

        .registration-actions button {
            background: linear-gradient(180deg, var(--saints-gold-light), var(--saints-gold)) !important;
            color: #090909 !important;
            border: 1px solid var(--saints-gold-light) !important;
            box-shadow: 0 5px 14px rgba(0,0,0,.25) !important;
            cursor: pointer;
        }

        .registration-actions button:hover {
            background: linear-gradient(180deg, #f5cf69, #dcae34) !important;
            box-shadow: 0 7px 18px rgba(214,165,43,.18) !important;
        }

        .registration-actions .cancel-button {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: transparent !important;
            color: #d2d2d2 !important;
            border: 1px solid #505050 !important;
            box-shadow: none !important;
        }

        .registration-actions .cancel-button:hover {
            background: #222222 !important;
            color: var(--saints-gold-light) !important;
            border-color: var(--saints-gold) !important;
        }

        .error-message {
            margin: 0 0 14px !important;
            padding: 9px 10px !important;
            border-radius: 7px !important;
            background: rgba(180, 40, 40, .16) !important;
            border: 1px solid rgba(220, 80, 80, .45) !important;
            color: #ffb0b0 !important;
            font-size: 11px !important;
            line-height: 1.35 !important;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px 12px;
                align-items: center;
            }

            .registration-container {
                width: min(100%, 360px) !important;
                padding: 22px 20px 20px !important;
                border-radius: 13px !important;
            }

            .gym-header {
                margin-bottom: 18px !important;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 14px 10px;
            }

            .registration-container {
                padding: 20px 16px 18px !important;
            }

            .gym-header h1 {
                font-size: 21px !important;
            }
        }
    </style>
</head>

<body>

    <div class="registration-container">

        <div class="gym-header">
            <h1>SAINTS GYM</h1>
            <p>Member Registration</p>
        </div>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="registration-form">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="member_id">Customer ID</label>
                <input
                    type="text"
                    id="member_id"
                    value="{{ member_id }}"
                    readonly
                >
            </div>

            <div class="form-group">
                <label for="surname">Surname</label>
                <input
                    type="text"
                    id="surname"
                    name="surname"
                    placeholder="Enter your surname"
                    required
                >
            </div>

            <div class="form-group">
                <label for="first_name">First Name</label>
                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    placeholder="Enter your first name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>

                <div class="phone-input-wrap phone-theme-dark">
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        data-phone-input
                        autocomplete="tel"
                        required
                    >
                </div>
            </div>

            <div class="registration-actions">
                <button type="submit">REGISTER</button>

                <a href="/" class="menu-button cancel-button">CANCEL</a>
            </div>

        </form>
    </div>

    <script src="{{ url_for('static', filename='phone.js') }}"></script>

</body>

</html>
