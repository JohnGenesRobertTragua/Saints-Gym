<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="csrf-token" content="{{ csrf_token() }}">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Guest Check-Out</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='phone.css') }}">


<style>
/* ==========================================
   SAINTS GYM CUSTOMER THEME
   ========================================== */

:root {
    --saints-black: #0b0b0b;
    --saints-panel: #151515;
    --saints-panel-2: #1d1d1d;
    --saints-gold: #d6a52b;
    --saints-gold-light: #f1c75b;
    --saints-gold-dark: #9c7013;
    --saints-silver: #d6d6d6;
    --saints-muted: #a7a7a7;
}

html {
    background: var(--saints-black) !important;
}

body {
    background:
        radial-gradient(circle at 50% 25%, rgba(214,165,43,.10), transparent 30%),
        linear-gradient(145deg, #080808 0%, #121212 52%, #080808 100%) !important;
    color: #ffffff !important;
    min-height: 100vh !important;
    position: relative;
    overflow-x: hidden;
}


.registration-container {
    position: relative;
    z-index: 1;
    background: rgba(18, 18, 18, .97) !important;
    border: 1px solid rgba(214, 165, 43, .34) !important;
    border-radius: 14px !important;
    box-shadow:
        0 18px 45px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,255,255,.025) inset,
        0 0 28px rgba(214,165,43,.06) !important;
}

.gym-header {
    text-align: center !important;
}


.gym-header h1,
.gym-title {
    color: #ffffff !important;
    text-shadow: 0 1px 0 #000, 0 0 14px rgba(214,165,43,.10);
    letter-spacing: .5px !important;
}

.gym-header p,
.gym-subtitle {
    color: var(--saints-gold-light) !important;
}

.form-group label {
    color: #f0f0f0 !important;
}

.form-group input,
.form-group select,
.form-group textarea,
input[type="text"],
input[type="tel"],
input[type="password"],
input[type="number"] {
    background: #202020 !important;
    color: #ffffff !important;
    border: 1px solid #4a4a4a !important;
    border-radius: 8px !important;
}

.form-group input::placeholder,
input::placeholder {
    color: #929292 !important;
}

.form-group input:focus,
input:focus,
textarea:focus,
select:focus {
    border-color: var(--saints-gold) !important;
    outline: none !important;
    box-shadow: 0 0 0 2px rgba(214,165,43,.16) !important;
}

button,
.menu-button:not(.cancel-button) {
    background: linear-gradient(180deg, var(--saints-gold-light), var(--saints-gold)) !important;
    color: #090909 !important;
    border: 1px solid var(--saints-gold-light) !important;
    border-radius: 8px !important;
    font-weight: 800 !important;
    box-shadow: 0 5px 14px rgba(0,0,0,.25) !important;
}

button:hover,
.menu-button:not(.cancel-button):hover {
    background: linear-gradient(180deg, #f5cf69, #dcae34) !important;
    color: #000000 !important;
    box-shadow: 0 7px 18px rgba(214,165,43,.18) !important;
}

button:disabled {
    background: #5a5a5a !important;
    color: #d0d0d0 !important;
    border-color: #666666 !important;
    box-shadow: none !important;
}

.cancel-button {
    background: transparent !important;
    color: #c8c8c8 !important;
    border: 1px solid #555555 !important;
}

.cancel-button:hover {
    background: #252525 !important;
    color: var(--saints-gold-light) !important;
    border-color: var(--saints-gold) !important;
}

.check-in-message,
.error-message {
    color: #f0f0f0 !important;
}

small {
    color: var(--saints-gold-light) !important;
}

a {
    color: var(--saints-gold-light);
}

.guest-name-group {
    margin-top: 10px !important;
}

.guest-name-readonly {
    cursor: default !important;
    opacity: 1 !important;
    background: #202020 !important;
    color: #f1c75b !important;
    font-weight: 700 !important;
}

.guest-name-readonly::placeholder {
    color: #777777 !important;
    font-weight: 400 !important;
}

@media (max-width: 600px) {
    .registration-container {
        border-radius: 12px !important;
    }
}
</style>

</head>

<body>

    <div class="registration-container">

        <div class="gym-header">

            <h1>SAINTS GYM</h1>

            <p>Guest Check-Out</p>

        </div>


        <form id="checkoutForm">


            <!-- PHONE NUMBER -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <div class="phone-input-wrap phone-theme-dark">
                    <input
                        type="tel"
                        id="phone"
                        data-phone-input
                        autocomplete="tel"
                        required
                    >
                </div>

            </div>


            <!-- GUEST NAME (READ ONLY) -->

            <div class="form-group guest-name-group">

                <label for="guestName">
                    Guest Name
                </label>

                <input
                    type="text"
                    id="guestName"
                    class="guest-name-readonly"
                    placeholder="Guest name will appear here"
                    readonly
                    tabindex="-1"
                >

            </div>


            <p
                style="
                    font-size: 12px;
                    text-align: center;
                    margin-bottom: 18px;
                "
            >
                Enter the same phone number
                used during guest check-in.
            </p>


            <div
                id="message"
                class="check-in-message"
            ></div>


            <!-- CHECK OUT -->

            <button
                type="submit"
                id="checkoutButton"
            >
                CHECK OUT
            </button>


            <!-- CANCEL -->

            <a
                href="/"
                class="menu-button cancel-button"
                style="margin-top: 15px;"
            >
                CANCEL
            </a>


        </form>

    </div>


    <script>

        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

        const phoneInput =
            document.getElementById(
                "phone"
            );


        const checkoutForm =
            document.getElementById(
                "checkoutForm"
            );


        const checkoutButton =
            document.getElementById(
                "checkoutButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const guestNameInput =
            document.getElementById(
                "guestName"
            );


        let guestLookupTimer = null;


        async function lookupGuestName() {

            guestNameInput.value = "";

            if (!window.SaintsGymPhone) {
                return;
            }

            const valid =
                await window.SaintsGymPhone.validate(phoneInput);

            if (!valid) {
                return;
            }

            const phone =
                await window.SaintsGymPhone.getPhoneE164(phoneInput);

            const phoneCountry =
                await window.SaintsGymPhone.getCountryIso(phoneInput);

            if (!phone) {
                return;
            }

            try {
                const response = await fetch(
                    "/api/guest-lookup",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": csrfToken
                        },
                        body: JSON.stringify({ phone: phone, phone_country: phoneCountry })
                    }
                );

                const data = await response.json();

                if (data.success && data.found) {
                    guestNameInput.value = data.full_name;
                }
            }
            catch (error) {
                guestNameInput.value = "";
            }
        }


        phoneInput.addEventListener(
            "input",
            function() {
                clearTimeout(guestLookupTimer);
                guestNameInput.value = "";
                guestLookupTimer = setTimeout(
                    lookupGuestName,
                    350
                );
            }
        );


        phoneInput.addEventListener(
            "change",
            function() {
                clearTimeout(guestLookupTimer);
                lookupGuestName();
            }
        );


        checkoutForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                message.textContent = "";

                if (!window.SaintsGymPhone) {
                    message.textContent =
                        "Phone-number component is still loading. Please try again.";
                    return;
                }

                const valid =
                    await window.SaintsGymPhone.validate(phoneInput);

                if (!valid) {
                    message.textContent =
                        phoneInput.parentElement.querySelector(".phone-validation-message")?.textContent ||
                        "Please enter a valid phone number.";
                    return;
                }

                const phone =
                    await window.SaintsGymPhone.getPhoneE164(phoneInput);

                const phoneCountry =
                    await window.SaintsGymPhone.getCountryIso(phoneInput);


                checkoutButton.disabled =
                    true;


                try {

                    const response =
                        await fetch(
                            "/api/guest-check-out",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",
                                    "X-CSRFToken": csrfToken
                                },

                                body: JSON.stringify({
                                    phone: phone,
                                    phone_country: phoneCountry
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (data.success) {

                        window.location.href =
                            `/check-out-success?type=Guest&full_name=${encodeURIComponent(data.full_name)}&identifier=${encodeURIComponent(data.phone)}&check_in_time=${encodeURIComponent(data.check_in_time)}&check_out_time=${encodeURIComponent(data.check_out_time)}&check_out_date=${encodeURIComponent(data.check_out_date)}`;

                    }
                    else {

                        message.textContent =
                            data.message;

                        checkoutButton.disabled =
                            false;

                    }

                }
                catch (error) {

                    message.textContent =
                        "Unable to complete check-out.";

                    checkoutButton.disabled =
                        false;

                }

            }
        );

    </script>

    <script src="{{ url_for('static', filename='phone.js') }}"></script>

</body>

</html>
