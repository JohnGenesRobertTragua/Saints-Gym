<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saints Gym - Staff Login</title>

    <style>
        :root {
            --gold: #d9a928;
            --gold-light: #f0c64a;
            --gold-dark: #9b7418;
            --black: #0b0b0b;
            --panel: #151515;
            --panel-2: #1c1c1c;
            --text: #f5f5f5;
            --muted: #b9b9b9;
            --border: #3b3b3b;
            --danger: #ff5b5b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 50% 15%, rgba(217,169,40,.10), transparent 32%),
                linear-gradient(135deg, #080808, #141414 55%, #090909);
        }

        .registration-container {
            width: 100%;
            max-width: 390px;
            padding: 30px 30px 28px;
            background: rgba(20,20,20,.97);
            border: 1px solid rgba(217,169,40,.48);
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0,0,0,.55), 0 0 28px rgba(217,169,40,.06);
        }

        .gym-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .gym-header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: .8px;
        }

        .gym-header p {
            margin: 6px 0 0;
            color: var(--gold-light);
            font-size: 13px;
        }

        .error-message {
            margin-bottom: 18px;
            padding: 11px 13px;
            border: 1px solid #8f2525;
            border-radius: 8px;
            background: #351313;
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
        }

        .form-group { margin-bottom: 17px; }

        label {
            display: block;
            margin-bottom: 7px;
            color: #f0f0f0;
            font-size: 12px;
            font-weight: 700;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #505050;
            border-radius: 7px;
            outline: none;
            background: #202020;
            color: #ffffff;
            font-size: 13px;
            transition: border-color .15s, box-shadow .15s;
        }

        input::placeholder { color: #929292; }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(217,169,40,.15);
        }

        .show-password {
            margin-top: -4px;
            margin-bottom: 18px;
        }

        .show-password label {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 0;
            color: #cfcfcf;
            font-size: 12px;
            font-weight: 400;
            cursor: pointer;
        }

        .show-password input {
            width: 14px;
            height: 14px;
            accent-color: var(--gold);
        }

        button,
        .menu-button {
            width: 100%;
            min-height: 43px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .1px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            border: 1px solid #e0b438;
            background: linear-gradient(180deg, var(--gold-light), var(--gold));
            color: #111111;
            box-shadow: 0 5px 14px rgba(217,169,40,.16);
            transition: transform .12s, filter .12s, box-shadow .12s;
        }

        button:hover {
            filter: brightness(1.08);
            box-shadow: 0 7px 18px rgba(217,169,40,.24);
        }

        button:active { transform: translateY(1px); }

        .forgot-link {
            display: block;
            margin-top: 10px;
            padding: 12px 10px;
            border: 1px solid #444444;
            border-radius: 7px;
            background: #202020;
            color: #e4e4e4;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            transition: border-color .15s, color .15s, background .15s;
        }

        .forgot-link:hover {
            border-color: var(--gold-dark);
            color: var(--gold-light);
            background: #252525;
        }

        .cancel-button {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            border: 1px solid #414141;
            background: transparent;
            color: #bdbdbd;
        }

        .cancel-button:hover {
            border-color: #6a6a6a;
            color: #ffffff;
            background: #1d1d1d;
        }

        @media (max-width: 480px) {
            body { padding: 18px; }
            .registration-container { padding: 27px 22px 24px; }
            .gym-header h1 { font-size: 24px; }
        }
    </style>
</head>

<body>

    <div class="registration-container">

        <div class="gym-header">
            <h1>SAINTS GYM</h1>
            <p>Staff Login</p>
        </div>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/staff-login">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="show-password">
                <label for="showPassword">
                    <input type="checkbox" id="showPassword">
                    <span>Show Password</span>
                </label>
            </div>

            <button type="submit">LOGIN</button>

            <a href="/staff-recovery" class="forgot-link">
                Forgot Username or Password?
            </a>

            <a href="/" class="menu-button cancel-button">
                BACK
            </a>

        </form>
    </div>

    <script>
        const showPassword = document.getElementById("showPassword");
        const password = document.getElementById("password");

        showPassword.addEventListener("change", function () {
            password.type = this.checked ? "text" : "password";
        });
    </script>

</body>
</html>
