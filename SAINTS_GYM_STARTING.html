<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting Saints Gym</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090909;color:#f4f0e7;font-family:Arial,sans-serif}
  main{text-align:center;padding:36px;width:min(420px,90vw);border:1px solid #4b3a0b;border-radius:18px;background:#101010}
  .mark{font-size:42px;color:#d9b333;font-weight:800;letter-spacing:2px}
  h1{font-size:20px;margin:14px 0 8px}
  p{color:#b9b1a0;font-size:14px}
  .spinner{width:28px;height:28px;margin:22px auto 0;border:3px solid #51431c;border-top-color:#e0bd38;border-radius:50%;animation:spin .8s linear infinite}
  #status{min-height:18px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
  <div class="mark">SAINTS GYM</div>
  <h1>Starting Saints Gym…</h1>
  <p id="status">Preparing your system. Please wait.</p>
  <div class="spinner" aria-label="Loading"></div>
</main>
<script>
(() => {
  const status = document.getElementById("status");
  const started = Date.now();
  const timer = setInterval(async () => {
    try {
      await fetch("http://127.0.0.1:5000/", { mode: "no-cors", cache: "no-store" });
      clearInterval(timer);
      status.textContent = "Opening Saints Gym…";
      location.replace("http://127.0.0.1:5000/");
    } catch (_) {
      if (Date.now() - started > 45000) {
        clearInterval(timer);
        status.textContent = "The server did not start. Close this window and try again.";
      }
    }
  }, 250);
})();
</script>
</body>
</html>
